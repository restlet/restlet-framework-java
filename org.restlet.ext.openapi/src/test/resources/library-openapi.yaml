openapi: 3.1.0
info:
  title: Library REST API
  version: 1.0.0
paths:
  /books:
    get:
      operationId: getBooks
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
