name: CI

on:
  push:
    branches:
      - "3.0"
  pull_request:
  workflow_dispatch:
concurrency:
  group:
    ${{ github.repository }}-${{ github.workflow }}-${{ github.event.number || github.head_ref || github.run_id || github.sha }}
  cancel-in-progress: true
env:
  JAVA_VERSION: 21
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Build and test with Maven
        # verify also runs the Spotless check, the JaCoCo coverage check and SpotBugs
        run: ./mvnw -B verify -P default,test
      - name: Check Javadoc
        run: ./mvnw -B -q compile javadoc:javadoc
      - name: Upload coverage and static analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/target/site/jacoco/
            **/target/spotbugsXml.xml
          if-no-files-found: ignore
