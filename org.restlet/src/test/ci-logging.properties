# Logging of the tests in CI (profile "ci-logging"): the console keeps the INFO level, while the
# FINE level of the Restlet loggers, including the steps of the Netty client connector, goes to
# target/restlet-fine.log, uploaded when the build fails. Diagnoses intermittent failures such as
# the connector errors of SecurityTestCase (issue #1601).
handlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler
.level=INFO
org.restlet.level=FINE

java.util.logging.ConsoleHandler.level=INFO

java.util.logging.FileHandler.level=FINE
java.util.logging.FileHandler.pattern=target/restlet-fine.log
java.util.logging.FileHandler.limit=0
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tT.%1$tL [%3$s] %4$s %5$s%6$s%n
